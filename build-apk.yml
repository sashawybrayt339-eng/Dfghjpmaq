name: Build Vortex APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project files
        run: |
          if [ ! -f package.json ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "ERROR: no package.json and no .zip in repo root"
              ls -la
              exit 1
            fi
            mkdir -p /tmp/proj
            unzip -q "$ZIP" -d /tmp/proj
            PKG=$(find /tmp/proj -name package.json -not -path "*/node_modules/*" | head -n 1)
            cp -r "$(dirname "$PKG")"/. .
          fi
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon (optional)
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Set app name and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode 1', s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.0.0"', s, count=1)
          p.write_text(s)
          st = Path('android/app/src/main/res/values/strings.xml')
          t = st.read_text()
          t = re.sub(r'(<string name="app_name">).*?(</string>)', r'\1Vortex Game\2', t, count=1)
          t = re.sub(r'(<string name="title_activity_main">).*?(</string>)', r'\1Vortex Game\2', t, count=1)
          st.write_text(t)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
