name: Build Godot APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Godot Project
        run: |
          mkdir -p /tmp/godot_project
          unzip -q *.zip -d /tmp/godot_project
          if [ $(ls -1 /tmp/godot_project | wc -l) -eq 1 ] && [ -d "/tmp/godot_project/$(ls -1 /tmp/godot_project | head -n 1)" ]; then
            mv /tmp/godot_project/*/* /tmp/godot_project/
          fi
          ls -la /tmp/godot_project/

      - name: Download Godot and Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v4.2.2-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/4.2.2.stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Debug Keystore in Godot Directory
        run: |
          # ساخت فایل کلید
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          # کپی کردن دقیقاً به پوشه‌ای که Godot انتظار داره
          mkdir -p ~/.local/share/godot/keystores
          cp debug.keystore ~/.local/share/godot/keystores/debug.keystore

      - name: Export APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd /tmp/godot_project
          # اجرای Godot با --verbose برای اینکه مجبور بشه پروژه رو بخونه
          /home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/Godot_v4.2.2-stable_linux.x86_64 --headless --verbose --editor --quit || true
          
          # دستور خروجی
          /home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/Godot_v4.2.2-stable_linux.x86_64 --headless --export-debug "Android" app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Game-APK
          path: /tmp/godot_project/app-debug.apk
          if-no-files-found: error
