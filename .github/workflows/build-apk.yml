name: Build Godot APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Godot Project
        run: |
          mkdir -p /tmp/godot_project
          unzip -q *.zip -d /tmp/godot_project
          if [ $(ls -1 /tmp/godot_project | wc -l) -eq 1 ] && [ -d "/tmp/godot_project/$(ls -1 /tmp/godot_project | head -n 1)" ]; then
            mv /tmp/godot_project/*/* /tmp/godot_project/
          fi
          ls -la /tmp/godot_project/

      - name: Download Godot and Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v4.2.2-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/4.2.2.stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.local/share/godot/keystores
          cp debug.keystore ~/.local/share/godot/keystores/debug.keystore
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Create Export Preset Configuration
        run: |
          cd /tmp/godot_project
          printf '[preset.0]\nname="Android"\nplatform="Android"\nrunnable=true\nadvanced_options=false\ndedicated_server=false\ncustom_features=""\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\nexport_path="app-debug.apk"\nencryption_include_filters=""\nencryption_exclude_filters=""\nencrypt_pck=false\nencrypt_directory=false\n\n[preset.0.options]\ngradle_build/use_gradle_build=true\ngradle_build/export_format=0\ngradle_build/min_sdk=""\ngradle_build/target_sdk=""\nkeystore_path="~/.local/share/godot/keystores/debug.keystore"\nkeystore_user="androiddebugkey"\nkeystore_password="android"\n' > export_presets.cfg

      - name: Export APK with Android Build Template
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GODOT_DEBUG_KEYSTORE: /home/runner/.local/share/godot/keystores/debug.keystore
          GODOT_DEBUG_KEYSTORE_USER: androiddebugkey
          GODOT_DEBUG_KEYSTORE_PASS: android
        run: |
          cd /tmp/godot_project
          GODOT_BIN=/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/Godot_v4.2.2-stable_linux.x86_64
          
          $GODOT_BIN --headless --editor --quit || true
          
          $GODOT_BIN --headless --export-debug "Android" app-debug.apk --install-android-template

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Game-APK
          path: /tmp/godot_project/app-debug.apk
          if-no-files-found: error
